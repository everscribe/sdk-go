name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # The committed go.work spans all six modules, so without this the
      # matrix's per-module build/vet/test never actually exercises module
      # isolation: a module could be missing a require and the go.work
      # resolution would paper over it. GOWORK=off forces each matrix leg
      # to resolve strictly from its own go.mod.
      GOWORK: "off"
    strategy:
      fail-fast: false
      matrix:
        module:
          - .
          - adapters/http/stdlib
          - adapters/http/gin
          - adapters/http/echo
          - adapters/http/fiber
          - adapters/grpc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...
      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test ./... -count=1 -race

  root-module-purity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Root module must not import any transport package
        run: |
          set -u
          # Capture go list's own output and exit status first, so a
          # failure of go list (unresolved import, proxy hiccup, etc.)
          # cannot masquerade as "no net/http found" via an empty grep.
          if ! deps=$(go list -deps ./pkg/event 2>&1); then
            echo "go list -deps ./pkg/event failed - cannot verify transport-neutrality:"
            echo "$deps"
            exit 1
          fi
          if echo "$deps" | grep -qx 'net/http'; then
            echo "pkg/event imports net/http; core must stay transport-neutral"
            exit 1
          fi
      - name: Root go.mod must stay at uuid plus testify
        run: |
          set -u
          # Parse go.mod structurally via `go mod edit -json` instead of
          # grepping raw text, so a bare top-level `require x v1` line (no
          # leading whitespace) is caught the same as one inside an
          # indented `require (...)` block.
          if ! modjson=$(go mod edit -json); then
            echo "go mod edit -json failed - cannot verify root module purity"
            exit 1
          fi
          allowed='["github.com/google/uuid","github.com/stretchr/testify","github.com/davecgh/go-spew","github.com/pmezard/go-difflib","gopkg.in/yaml.v3"]'
          unexpected=$(echo "$modjson" | jq -r --argjson allowed "$allowed" '
            (.Require // [])[]
            | select((.Path as $p | $allowed | index($p)) == null)
            | "\(.Path) \(.Version)"
          ')
          if [ -n "$unexpected" ]; then
            echo "unexpected dependency in the root module:"
            echo "$unexpected"
            exit 1
          fi
